/* Market Day — the direction chosen on 5 Nov 2026, built out as a working
   prototype. CSS taken from the design study and extended only where a real
   flow needed it (product page, booking, basket, menu). */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#E9ECE8;color:#141A16;
  /* The same stack the desktop declares, so the two prototypes are one product.
     The difference is that here the font is actually DOWNLOADED — the @font-face
     rules are written into the page by build-marketday.py from fonts/. The
     desktop has asked for Manrope since the beginning and never fetched it,
     which is why it has always rendered in the device's own font on a phone. */
  font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
p,h1,h2,h3,h4,ul,dl,dd{margin:0}
ul{padding:0;list-style:none}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid #0B3D2B;outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* Verbatim from design/index.html in everything but notation: the desktop
   writes background:var(--deep) and border-radius:var(--r-s), and this build
   has no token layer, so it spells the same values out — #0B3D2B and 12px. The
   drift check still reports .skip and .skip:focus as differing between the two,
   and that report is CORRECT and should be left alone: identical in effect,
   different in spelling, and the alternative is importing a token system this
   design does not use. Everything else that collided was renamed md-*.

   The skip link is a shared component and the
   drift check compares it across every page; a second way of writing the same
   thing is reported as drift on ten pages at once. Everything else here that
   collided with a desktop class name was renamed md-* instead, because this is
   a different surface and may legitimately differ. */
.skip{
  position:absolute;left:12px;top:-64px;z-index:300;
  background:#0B3D2B;color:#fff;padding:12px 18px;border-radius:12px;
  font-weight:700;text-decoration:none;transition:top .18s cubic-bezier(.22,.61,.36,1);
}
.skip:focus{top:12px}

/* the phone shell. On a laptop it is framed so it reads as a phone; on a
   phone it fills the screen. */
.phone{width:100%;max-width:390px;margin:0 auto;min-height:100dvh;
  display:flex;flex-direction:column;background:#fff;position:relative;overflow:hidden}
@media(min-width:760px){
  body{background:#DEE5E0;padding:30px 0 34px}
  body::before{content:attr(data-caption);display:block;text-align:center;margin-bottom:14px;
    font-size:13px;line-height:20px;font-weight:700;color:#3D443F}
  .phone{height:844px;min-height:0;border-radius:30px;
    box-shadow:0 0 0 10px #111815,0 0 0 11px #39443E,0 22px 54px rgba(8,20,15,.30)}
}
.scr{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

/* header */
.hdr{background:#0B3D2B;color:#fff;padding:8px 8px 12px 16px;flex:0 0 auto}
.hdr :focus-visible{outline-color:#fff}
.hrow{display:flex;align-items:center;gap:4px;justify-content:space-between;min-height:44px}
.logo{font-size:22px;line-height:28px;font-weight:800;letter-spacing:-.02em}
.logo i{font-style:normal;color:#B9D3C4}
.ib{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;
  color:inherit;border-radius:22px;position:relative;flex:0 0 44px}
.badge{position:absolute;top:2px;right:0;min-width:20px;height:20px;border-radius:10px;
  background:#fff;color:#0B3D2B;font-size:12px;line-height:20px;font-weight:800;text-align:center;padding:0 5px}
.search{display:flex;align-items:center;gap:8px;height:48px;margin:8px 8px 0 0;background:#fff;
  border-radius:12px;padding:0 4px 0 14px;color:#141A16}
.search svg{flex:0 0 auto;color:#0B3D2B}
.search input{flex:1;min-width:0;height:44px;border:0;background:transparent;
  font-family:inherit;font-size:16px;color:#141A16}
.search input::placeholder{color:#5A625D}
.search input:focus-visible{outline:none}

/* chips */
.md-chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.md-chips::-webkit-scrollbar{display:none}
/* Unselected is an OUTLINE on the page's own white, selected is a solid fill.
   The grey-filled version made every chip look like the Filters button and the
   switch next to it — four pill-shaped filled things in a row, none of which
   told you which was a choice and which was already chosen. Outline vs fill
   carries that difference without adding a colour.
   #14704F on #fff measures 6.07:1 as text, and the outline needs 3:1.
   inset box-shadow rather than border, so the chip does not change size when
   it fills — and because audit.py checks for exactly that. */
.md-chip{flex:0 0 auto;min-height:44px;display:inline-flex;align-items:center;padding:0 14px;
  border:0;border-radius:22px;background:#fff;color:#14704F;
  box-shadow:inset 0 0 0 1.5px #14704F;
  font-size:15px;line-height:20px;font-weight:700;white-space:nowrap}
/* The ENGAGED state of a filter control is --action #14704F, not --deep.
   That is the desktop's own answer: .filtoggle:hover, .fapply:hover,
   .fclear:hover and .fclose:hover in design/shop.html all go to --action,
   while --deep is kept for resting text and the small count badge. The phone
   had --deep on all four filter controls and read as near-black.
   White on #14704F measures 6.07:1. */
.md-chip[aria-current]{background:#14704F;color:#fff;box-shadow:none}

.sh{display:flex;justify-content:space-between;align-items:center;padding:0 8px 0 16px;min-height:44px}
.sh h2{font-size:20px;line-height:28px;font-weight:800}
/* `.see` is a BUTTON in the markup and this rule only ever named `a`, so the
   See all control has been unstyled since the build was written: browser
   default, 56x24, under the 44px bar, on the home screen. Every earlier tap-
   size sweep happened to run on a screen with no section header on it. */
.sh a,.sh .see{font-size:15px;line-height:20px;font-weight:700;color:#0B3D2B;min-height:44px;
  border:0;background:none;cursor:pointer;
  display:inline-flex;align-items:center;padding:0 8px;text-decoration:underline;text-underline-offset:3px}

/* product card */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:4px 16px 16px}
.md-pc{display:flex;flex-direction:column;min-width:0;border:0;background:none;
  text-align:left;padding:0;color:inherit}
.md-pc .ph{aspect-ratio:4/5;border-radius:12px;background:#E4E7E2;overflow:hidden}
.md-pc .ph img{width:100%;height:100%;object-fit:cover}
.pt{font-size:14px;line-height:20px;font-weight:400;margin-top:8px;height:40px;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pp{font-size:20px;line-height:28px;font-weight:800;letter-spacing:-.02em;margin-top:2px;
  font-variant-numeric:tabular-nums}
/* The previous price had NO rule of its own, so it inherited .pp — 20px at
   weight 800 — and a struck-through number that heavy competes with the price
   you are meant to read. This is the desktop's rule for the same thing,
   `.price s` in design/shop.html: smaller, regular weight, --soft.
   #6E7671 on white is 4.67:1. It fails on a tinted band at 4.36:1, so do not
   reuse this colour on one. */
.pp s{margin-left:6px;font-size:13px;line-height:20px;font-weight:400;color:#6E7671}
.md-pm{font-size:13px;line-height:16px;color:#5A625D;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-pm b{color:#14704F;font-weight:700}

/* service row — photo, but the amber "soonest" pill keeps it visibly a
   different kind of thing from a product */
.md-svc{background:#F7F8F5;padding:12px 0 8px;border-top:1px solid #DDE1DD;border-bottom:1px solid #DDE1DD}
.md-sl{padding:0 16px}
.md-sr{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;min-height:76px;
  padding:8px 0;border-bottom:1px solid #DDE1DD;width:100%;border-left:0;border-right:0;border-top:0;
  background:none;text-align:left;color:inherit}
.md-sl li:last-child .md-sr{border-bottom:0}
.sthumb{width:64px;height:60px;border-radius:10px;overflow:hidden;background:#E4E7E2}
.sthumb img{width:100%;height:100%;object-fit:cover}
.st{font-size:15px;line-height:20px;font-weight:700;display:block}
.sm{font-size:13px;line-height:20px;color:#5A625D;display:block}
.soon{display:inline-block;margin-top:3px;padding:1px 8px;border-radius:10px;
  background:#FCEBC8;color:#5A3400;font-size:12px;line-height:18px;font-weight:800}
.sp{text-align:right;font-size:12px;line-height:16px;color:#5A625D}
.sp b{display:block;font-size:17px;line-height:24px;font-weight:800;color:#141A16}

/* bottom bar (app only) */
.md-nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #C9CFCA;background:#fff;
  flex:0 0 auto;padding-bottom:env(safe-area-inset-bottom)}
.md-nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:60px;font-size:12px;line-height:16px;font-weight:500;color:#5A625D;border:0;background:none}
.md-nav button[aria-current]{color:#0B3D2B;font-weight:800}

/* detail */
.dtop{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 6px;
  flex:0 0 auto;border-bottom:1px solid #DDE1DD;background:#fff}
.dtop span.ttl{font-size:15px;line-height:20px;font-weight:700}
.dph{aspect-ratio:1/1;background:#E4E7E2;overflow:hidden}
.dph img{width:100%;height:100%;object-fit:cover}
.db{padding:16px}
.dt{font-size:20px;line-height:28px;font-weight:500}
.dpr{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin-top:6px}
.dpr b{font-size:34px;line-height:40px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.dpr s{margin-left:0;font-size:13px;line-height:20px;font-weight:400;color:#6E7671}
.save{font-size:13px;line-height:20px;font-weight:700;background:#E3EEE7;color:#0B3D2B;padding:2px 8px;border-radius:6px}
.md-stock{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:15px;line-height:20px;font-weight:700;color:#14704F}
.md-stock i{width:10px;height:10px;border-radius:5px;background:#14704F}
.facts{margin-top:16px;border-top:1px solid #DDE1DD}
.fact{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;min-height:68px;
  padding:10px 0;border-bottom:1px solid #DDE1DD}
.fi{width:44px;height:44px;border-radius:22px;background:#F1F3EF;color:#0B3D2B;display:grid;
  place-items:center;font-size:17px;font-weight:800;overflow:hidden}
.fact b{display:block;font-size:17px;line-height:24px;font-weight:800}
.fact span.sub{display:block;font-size:13px;line-height:20px;color:#5A625D}
.fact .big{color:#14704F}
.md-foot{flex:0 0 auto;border-top:1px solid #C9CFCA;background:#fff;padding-bottom:env(safe-area-inset-bottom)}
.hold{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;background:#E3EEE7;
  color:#0B3D2B;padding:12px 16px}
.hold .lk{width:40px;height:40px;border-radius:20px;background:#0B3D2B;color:#fff;display:grid;place-items:center}
.hold b{display:block;font-size:15px;line-height:20px;font-weight:800}
.hold span{display:block;font-size:13px;line-height:20px;color:#141A16}
.buy{display:flex;gap:12px;align-items:center;padding:10px 16px 12px;background:#fff}
.buy .tot{font-size:12px;line-height:16px;color:#5A625D}
.buy .tot b{display:block;font-size:20px;line-height:28px;font-weight:800;color:#141A16}
.cta{flex:1;min-height:52px;border:0;border-radius:12px;background:#0B3D2B;color:#fff;font-size:17px;font-weight:800}
.cta[disabled]{background:#C9CFCA;color:#5A625D}

/* booking */
.md-days{display:flex;gap:9px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.md-days::-webkit-scrollbar{display:none}
.md-day{flex:0 0 auto;width:62px;min-height:74px;padding:9px 4px;display:flex;flex-direction:column;
  align-items:center;gap:1px;border:0;border-radius:12px;background:#F1F3EF;color:#141A16;position:relative}
.md-day small{font-size:12px;line-height:17px;font-weight:700;color:#5A625D}
.md-day b{font-size:19px;line-height:26px;font-weight:800}
.md-day i{width:6px;height:6px;border-radius:3px;background:#14704F;margin-top:3px;display:block}
.md-day[aria-pressed="true"]{background:#0B3D2B;color:#fff}
.md-day[aria-pressed="true"] small{color:#D6E7DC}
.md-day[aria-pressed="true"] i{background:#fff}
.md-day[disabled]{opacity:.45}
.md-day[disabled] i{background:transparent}
.md-times{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 16px}
.md-time{min-height:48px;border:0;border-radius:10px;background:#F1F3EF;color:#141A16;
  font-size:16px;line-height:24px;font-weight:700}
.md-time[aria-pressed="true"]{background:#0B3D2B;color:#fff}
.md-time[disabled]{background:none;box-shadow:inset 0 0 0 1px #DDE1DD;color:#8B938D;text-decoration:line-through}

/* basket */
.bl{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #DDE1DD}
.bl .bth{width:64px;height:64px;border-radius:10px;overflow:hidden;background:#E4E7E2}
.bl .bth img{width:100%;height:100%;object-fit:cover}
/* Both are spans inside one grid cell, so without display:block the title's
   last line and the seller's name run together: "Ground spice blend, 250" /
   "gDebbies". Seen on a screenshot, not in any check. */
.bl .bn{display:block;font-size:15px;line-height:20px;font-weight:700}
.bl .bm{display:block;font-size:13px;line-height:20px;color:#5A625D}
.bl .bp{text-align:right;font-weight:800}
.rm{border:0;background:none;color:#5A625D;font-size:13px;font-weight:700;min-height:44px;padding:0 6px;text-decoration:underline}
.tot2{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 4px;font-size:19px;font-weight:800}
.md-empty{padding:56px 24px;text-align:center;color:#5A625D}
.md-empty h2{color:#141A16;font-size:20px;margin-bottom:6px}

/* toast */
.md-toast{position:fixed;left:50%;transform:translate(-50%,160%);bottom:84px;z-index:60;
  width:min(358px,calc(100% - 32px));background:#141A16;color:#fff;border-radius:12px;
  padding:13px 15px;font-size:15px;line-height:22px;font-weight:700;
  transition:transform .26s cubic-bezier(.22,.61,.36,1);visibility:hidden}
.md-toast[data-open="true"]{transform:translate(-50%,0);visibility:visible}

/* burger menu — the WEBSITE version's answer to the app's tab bar */
.shade{position:fixed;inset:0;z-index:70;background:rgba(8,20,15,.5);opacity:0;pointer-events:none;
  transition:opacity .2s ease}
.shade[data-open="true"]{opacity:1;pointer-events:auto}
.menu{position:fixed;z-index:75;top:0;bottom:0;right:0;width:min(300px,86vw);background:#fff;
  transform:translateX(100%);transition:transform .26s cubic-bezier(.22,.61,.36,1);
  display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.menu[data-open="true"]{transform:none}
.menu .mh{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 18px;
  border-bottom:1px solid #DDE1DD;min-height:56px}
.menu .mh b{font-size:17px;font-weight:800}
.menu nav{padding:8px 0}
.menu nav button{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 18px;
  border:0;background:none;font-size:17px;font-weight:700;color:#141A16;text-align:left}
.menu nav button[aria-current]{color:#0B3D2B;background:#F1F3EF}
.menu nav button .cnt{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:#0B3D2B;
  color:#fff;font-size:12px;line-height:22px;font-weight:800;text-align:center;padding:0 6px}
@media(min-width:760px){
  .shade,.menu{position:absolute}
}

/* ------------------------------------------------- browse, filters, search */
.md-chip.on{background:#14704F;color:#fff;box-shadow:none}
.md-chip svg{margin-left:4px}
.md-chips.md-active{padding-top:0}
.md-bar{display:flex;align-items:center;gap:10px;padding:10px 16px 2px}
.md-fbtn{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 15px;border:0;
  border-radius:22px;background:#14704F;color:#fff;font-size:15px;line-height:20px;font-weight:700}
.md-count{font-size:14px;line-height:20px;color:#5A625D}
.md-more{display:block;width:calc(100% - 32px);margin:4px 16px 20px;min-height:52px;border:0;
  border-radius:12px;background:#F1F3EF;color:#0B3D2B;font-size:16px;font-weight:800}
.md-fine{padding:6px 16px 20px;margin:0;font-size:13px;line-height:20px;color:#5A625D}
.md-sec{font-size:17px;line-height:24px;font-weight:800;margin:0;padding-bottom:2px}
.db2{padding:4px 16px 16px}
.md-lede{font-size:15px;line-height:23px;color:#3D443F;margin:0 0 12px}

/* The photo-less card. Fourteen of the twenty-four products have no
   photograph, and a photo-led design with no photo is its weakest moment, so
   the fallback is drawn properly rather than left as a grey rectangle. */
.md-well{width:100%;height:100%;display:grid;place-items:center;background:#E7EDE8;color:#0B3D2B}
.md-well.big{aspect-ratio:1/1}
.md-pc .ph{position:relative}
.md-cut,.md-oos{position:absolute;left:8px;top:8px;padding:2px 9px;border-radius:12px;
  background:#0B3D2B;color:#fff;font-size:12px;line-height:18px;font-weight:800}
.md-oos{background:#5A625D}

.md-empty{padding:54px 26px;text-align:center;color:#5A625D}
.md-empty h3{font-size:20px;line-height:28px;color:#141A16;margin:12px 0 6px}
.md-empty p{font-size:15px;line-height:23px;margin:0}
.md-empty svg{color:#9AA29D;margin:0 auto;display:block}
.md-empty .cta{display:inline-flex;margin-top:14px;padding:0 22px;flex:0 0 auto}
.md-empty .cta.ghost{background:#F1F3EF;color:#0B3D2B}
.md-ok{width:62px;height:62px;border-radius:31px;background:#E3EEE7;color:#0B3D2B;
  display:grid;place-items:center;margin:0 auto 4px}

/* ------------------------------------------------------- the filter sheet */
.md-fshade{position:fixed;inset:0;z-index:80;background:rgba(8,20,15,.5);opacity:0;
  pointer-events:none;transition:opacity .2s ease}
.md-fshade[data-open="true"]{opacity:1;pointer-events:auto}
.md-fsheet{position:fixed;z-index:85;left:50%;bottom:0;width:min(390px,100%);max-height:88dvh;
  transform:translate(-50%,100%);display:flex;flex-direction:column;background:#fff;
  border-radius:22px 22px 0 0;box-shadow:0 -14px 40px rgba(8,20,15,.3);
  transition:transform .26s cubic-bezier(.22,.61,.36,1);overscroll-behavior:contain}
.md-fsheet[data-open="true"]{transform:translate(-50%,0)}
.md-fsheet .grab{width:40px;height:4px;border-radius:2px;background:#C9CFCA;margin:9px auto 2px;flex:0 0 auto}
.md-fsheet .fh{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 18px;flex:0 0 auto}
.md-fsheet .fh h2{flex:1;font-size:19px;font-weight:800;margin:0}
/* min-height:0 is what makes this scroll instead of growing over its own
   footer. Without it "Show results" is a button you can see and cannot press
   — the exact fault the other mobile build shipped with once. */
.md-fsheet .fb{flex:1 1 auto;min-height:0;overflow-y:auto;padding:4px 18px 16px}
.md-fsheet .ff{flex:0 0 auto;display:flex;gap:10px;padding:12px 16px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid #DDE1DD;background:#fff}
.md-fsheet .ff button{flex:1;min-height:50px;border:0;border-radius:12px;font-size:16px;font-weight:800}
.md-fsheet .ff #freset{background:#F1F3EF;color:#141A16}
.md-fsheet .ff #fapply{background:#14704F;color:#fff}
.md-fg{padding:14px 0;border-bottom:1px solid #DDE1DD}
.md-fg:last-child{border-bottom:0}
.md-fg h3{font-size:15px;font-weight:800;margin:0 0 10px}
.md-fchips{display:flex;flex-wrap:wrap;gap:8px}
@media(min-width:760px){.md-fshade,.md-fsheet{position:absolute}}

/* ------------------------------------------------------------- long content */
.md-fold{border-top:1px solid #DDE1DD}
.md-fold>summary{display:flex;align-items:center;min-height:56px;padding:0 16px;cursor:pointer;
  font-size:16px;font-weight:700;list-style:none}
.md-fold>summary::-webkit-details-marker{display:none}
.md-fold>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid #5A625D;
  border-bottom:2px solid #5A625D;transform:rotate(45deg);transition:transform .2s ease}
.md-fold[open]>summary::after{transform:rotate(-135deg)}
.md-fold .in{padding:0 16px 16px;font-size:15px;line-height:23px;color:#3D443F}
.md-fold .in p{margin:0}
.md-stock{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:15px;line-height:20px;font-weight:700}
.md-stock i{width:10px;height:10px;border-radius:5px;background:currentColor}
.md-stock.ok{color:#14704F}
.md-stock.low{color:#8A4B00}
.md-stock.out{color:#5A625D}

/* ------------------------------------------------------------------ checkout */
.md-steps{display:flex;gap:8px;align-items:center;padding:14px 16px 0}
.md-st{flex:1;height:6px;border-radius:3px;background:#DDE1DD}
.md-st.now{background:#0B3D2B}
.md-st.done{background:#8FBBA2}
.md-st svg{display:none}
.md-fld{display:block;margin-bottom:14px}
.md-fld span{display:block;font-size:14px;line-height:21px;font-weight:700;margin-bottom:6px}
.md-fld input{width:100%;min-height:52px;padding:0 14px;border:0;box-shadow:inset 0 0 0 1.5px #7D847F;
  border-radius:12px;background:#fff;color:#141A16;font-family:inherit;font-size:16px;line-height:24px}
.md-fld .hint{font-size:13px;line-height:20px;color:#5A625D;font-weight:400;margin:5px 0 0}
.md-pay{display:flex;align-items:center;width:100%;min-height:56px;padding:0 16px;margin-bottom:10px;
  border:0;border-radius:12px;background:#F1F3EF;color:#141A16;font-size:16px;font-weight:700;text-align:left}
.md-pay::before{content:"";width:20px;height:20px;border-radius:10px;box-shadow:inset 0 0 0 2px #7D847F;
  margin-right:12px;flex:0 0 20px}
.md-pay[aria-pressed="true"]{background:#E3EEE7;color:#0B3D2B}
.md-pay[aria-pressed="true"]::before{box-shadow:inset 0 0 0 6px #0B3D2B}
.md-appt{padding:12px 14px;border-radius:12px;background:#F7F8F5;margin-bottom:12px}
.md-appt b{display:block;font-size:15px;line-height:21px}
.md-appt span{display:block;font-size:13px;line-height:20px;color:#5A625D}

/* ------------------------------------------------------- become a seller */
.md-hero{padding:22px 16px;background:#E3EEE7;color:#0B3D2B}
.md-hero p{margin-top:8px;font-size:15px;line-height:23px;color:#14301F}
.md-why{padding:0 16px;margin:0;display:flex;flex-direction:column;gap:12px}
.md-why li{list-style:none}
.md-why b{display:block;font-size:16px;line-height:23px}
.md-why span{display:block;font-size:14px;line-height:21px;color:#5A625D;margin-top:2px}
.md-steps2{counter-reset:s;padding:0 16px;margin:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.md-steps2 li{counter-increment:s;display:flex;gap:12px;align-items:center;font-size:15px;
  line-height:22px;font-weight:700}
.md-steps2 li::before{content:counter(s);flex:0 0 30px;height:30px;border-radius:15px;background:#0B3D2B;
  color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.md-undec{margin:12px 0;padding:13px 15px;border-radius:12px;background:#F7F8F5;
  box-shadow:inset 0 0 0 1px #DDE1DD;font-size:14px;line-height:22px;color:#3D443F}
.md-undec b{color:#141A16}

/* ------------------------------------------- seasonal and special offers
   The phone's slot for campaigns, and it is a PORT of the desktop hero, not a
   new design. Every value below is the desktop's own — and specifically the
   desktop's own PHONE values, because design/index.html already answers this
   at @media(max-width:820px): art on top at 16/10, text under it, and the
   discount disc shrunk to 82px and moved clear of the composition rather than
   sitting on it. The first attempt here invented a side-by-side layout, a
   different green, black headlines and a square tag, and was rightly rejected.
   If a value here stops matching design/index.html, the desktop is right.

   The one deliberate difference is rotation: it does not auto-advance. A band
   that moves by itself on a 390px screen competes with the goods beneath it,
   and WCAG 2.2.2 would then demand a pause control that costs room the screen
   has not got. Swipe and dots instead, so there is nothing to pause. */
.md-camp{position:relative;border-bottom:1px solid #E7EBE7}
.md-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;
  padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.md-track::-webkit-scrollbar{display:none}
/* .hero + .slide, at the desktop's <=820px shape */
.md-slide{flex:0 0 calc(100% - 32px);scroll-snap-align:center;
  border-radius:32px;                        /* --r-xl */
  box-shadow:inset 0 0 0 1px #E7EBE7;        /* --hair */
  display:grid;grid-template-columns:minmax(0,1fr);gap:20px;
  padding:32px 24px 24px;overflow:hidden}
.md-cart{order:1;position:relative;aspect-ratio:16/10;display:grid;place-items:center}
.md-cart img{width:100%;height:100%;object-fit:contain}
.md-slide .ctxt{order:2;min-width:0}
/* .eyebrow */
.md-eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:#146237;margin:0 0 14px}
/* .slide h2 — clamp(28px,3.4vw,52px) resolves to 28px at phone width, and the
   colour is --deep, not ink. */
.md-slide h3{font-size:28px;line-height:1.1;font-weight:800;color:#0B3D2B;max-width:14ch}
/* .slide .lede — clamp(15px,1.2vw,19px) resolves to 15px here */
.md-slide .clede{margin:14px 0 0;font-size:15px;line-height:22px;color:#5A625C;max-width:34ch}
/* .btn-p, with the justify-content:center the desktop itself adds on a phone.
   NOT the phone build's own .cta: that is a different green at a bigger size,
   and using it here made one product look like two. */
.md-cbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:48px;margin-top:24px;padding:0 26px;background:#14704F;color:#fff;border:0;
  border-radius:12px;                        /* --r-s */
  font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(11,61,43,.9)}
/* .heroart .disc at <=820px: white, circular, clear of the product */
.md-disc{position:absolute;right:0;bottom:0;width:82px;height:82px;border-radius:50%;
  background:#fff;display:grid;place-content:center;text-align:center;
  box-shadow:0 8px 24px rgba(11,61,43,.14)}
.md-disc .u,.md-disc .o{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;color:#5A625C}
.md-disc .n{display:block;font-size:24px;font-weight:800;letter-spacing:-.04em;color:#14181A;line-height:1.05}
/* .dots / .dot, with a 44px hit area around the desktop's 9px mark — the only
   change, and it is the phone target rule, not a visual one. */
.md-dots{display:flex;justify-content:center;align-items:center;gap:8px;padding-bottom:22px}
.md-dots button{width:44px;height:44px;display:grid;place-items:center;
  background:none;border:0;cursor:pointer;padding:0}
.md-dots button::before{content:"";width:9px;height:9px;border-radius:50%;background:#C3CDC6;
  transition:background .18s cubic-bezier(.2,.7,.3,1),width .18s cubic-bezier(.2,.7,.3,1)}
.md-dots button[aria-current="true"]::before{background:#0B3D2B;width:22px;border-radius:999px}

/* ---------------------------------------- VARIANT ONLY: Products / Services
   Built for design/md-web-switch.html so it can be compared against the
   regular build. NOT in md-web.html or md-app.html.

   This is NOT the 5 November swipe switch from design/mobile.html. That one is
   76px tall with an icon stacked above a two-word label on each side, and it
   was rejected here ("the old switch sucks"). This is the compact pill from
   Riccardo's own reference: one line, two words, 48px.

   The colours are the ones that were already measured, because those did not
   need changing: --tint2 track, --deep thumb, white on the filled half,
   --deep on the empty one (10.90:1 on #EDF4E9). What changed is geometry. */
.md-sw{padding:14px 16px 2px}
.md-swtrack{position:relative;display:grid;grid-template-columns:1fr 1fr;
  background:#EDF4E9;border-radius:999px;padding:5px;
  box-shadow:inset 0 0 0 1px #E7EBE7;
  touch-action:pan-y}            /* the page must still scroll under a thumb */
.md-swthumb{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);
  background:#0B3D2B;border-radius:999px;pointer-events:none;
  box-shadow:0 6px 18px rgba(11,61,43,.26);
  transition:left .26s cubic-bezier(.2,.7,.3,1)}
.md-swtrack.dragging .md-swthumb{transition:none}
.md-swhalf{position:relative;z-index:1;min-height:44px;display:flex;
  align-items:center;justify-content:center;border:0;background:none;
  border-radius:999px;cursor:pointer;font-family:inherit;
  font-size:16px;line-height:22px;font-weight:800;color:#0B3D2B;
  -webkit-tap-highlight-color:transparent;
  transition:color .22s cubic-bezier(.2,.7,.3,1)}
.md-swhalf[aria-selected="true"]{color:#fff}
/* While a finger is mid-travel the label the thumb is actually under turns
   white, rather than waiting for the drag to finish. The 5 Nov sweep found
   three colour rules that each passed a midpoint spot-check and failed
   elsewhere in the travel, so this is swept end to end, not sampled. */
.md-swtrack.dragging .md-swhalf{color:#0B3D2B}
.md-swtrack.dragging .md-swhalf.on-thumb{color:#fff}
.md-swhalf:focus-visible{outline:3px solid #14704F;outline-offset:3px}
.md-swhalf[aria-selected="true"]:focus-visible{outline-color:#fff;outline-offset:-5px}

/* ------------------------------------- VARIANT 3 ONLY: the chrome stays put
   .md-stick's `top` is set from JS, because the header's height depends on
   the rendered search row and on the phone's safe-area inset. A hard-coded
   number is right on exactly one device. */
.md-stick{position:sticky;z-index:60;background:#fff;box-shadow:0 1px 0 #E7EBE7}
/* VARIANT 4: the same pinned block, but it tucks up behind the header. The
   header is z-index 70 and this is 60, so it slides UNDER the green bar and
   the search row rather than over them.

   NAMED .md-tuck, NOT .md-slide: `.md-slide` is the offers carousel's slide,
   twenty lines down, and the first version of this reused it. The sticky
   block silently inherited that slide's 32px padding, its 32px radius, its
   hairline and its overflow:hidden — a 110px bar where 54px was asked for.

  /* VARIANT 4: the switch hides while you read and returns when you ask.
     Three numbers, and they are the whole design:
       DOWN 120 — how far down the page before it will hide at all, so it
                  never flinches at the first flick;
       UP   80  — how much CUMULATIVE upward scroll brings it back. Riccardo
                  asked for "control and calm": a switch that reappears on the
                  first pixel of an upward scroll is the thing that feels
                  twitchy, because a phone scroll is never one clean
                  direction. The counter resets whenever the direction
                  changes, so a wobble does not add up to a reveal;
       260ms    — the same duration and the same easing as the switch thumb,
                  so the two movements read as one component.
     It translates up by its own height, and the header sits above it in the
     stacking order, so it slides UNDER the green bar rather than over it. */
  function wireSlide() {
    if (!SLIDE) return;
    var stick = $("#stick");
    if (!stick) return;
    /* top:0 — it pins to the VIEWPORT, not under the header. The header is in
       normal flow above it and scrolls away, so there is no height to
       measure any more (the Amazon filter-bar pattern). */
    stick.style.top = "0px";

    /* DOWN 80 / UP 100, set from the tuner rather than argued about.
       JITTER is the fix for "it only comes back when I reach the top": a
       finger scroll is never one clean direction, and momentum and rubber-
       banding throw in stray downward deltas of a pixel or two. Zeroing the
       counter on those meant the upward total often never reached the
       threshold at all, so the only thing that ever revealed the switch was
       the page hitting the DOWN floor. Anything under 6px down is momentum,
       not a change of mind. */
    var DOWN = 80, UP = 100, JITTER = 6;
    var last = window.scrollY, up = 0, hidden = false;
    function show(v) {
      if (hidden === !v) return;
      hidden = !v;
      stick.classList.toggle("off", hidden);
    }
    window.addEventListener("scroll", function () {
      var y = window.scrollY, d = y - last;
      last = y;
      if (y <= DOWN) { up = 0; show(true); return; }
      if (d > JITTER) { up = 0; show(false); }
      else if (d < 0) {
        up += -d;
        if (up >= UP) show(true);
      }
    }, { passive: true });
  }

     twice (the 5 Nov swipe switch and the drag-scroll rows): a pointerup at
     the end of a drag fires a click on whatever is under the finger, so

  function wireSwitch() {

      if (e.key === "ArrowLeft" || e.key === "Home") { e.preventDefault(); pick("p"); $("#sw-p").focus(); }
    });

  function wireCampaigns() {
    var track = $("#ctrack"), dots = $("#cdots");

      var b = e.target.closest("[data-cdot]");

    function centre(n) {
      var sl = $$(".md-slide", track)[n];

      var g = el.getAttribute("data-f"), v = el.getAttribute("data-v");
      if (g === "cat" || g === "origin" || g === "city") {
        var a = box[g], i = a.indexOf(v); if (i < 0) a.push(v); else a.splice(i, 1);
      } else if (g === "days") box.days = box.days === +v ? 0 : +v;
      else if (g === "rating") box.rating = box.rating === +v ? 0 : +v;
      else if (g === "offers") box.offers = !box.offers;
      else if (g === "soon") box.soon = !box.soon;
      else if (g === "sort") box.sort = v;
      PAGE[kind] = 8;
      buildFilter(kind); return;
    }
    if ((el = t.closest("[data-unf]"))) {
      var b2 = route.name === "services" ? FS : F, k2 = el.getAttribute("data-unf"), v2 = el.getAttribute("data-v");
      if (k2 === "cat" || k2 === "origin" || k2 === "city") {
        var j = b2[k2].indexOf(v2); if (j >= 0) b2[k2].splice(j, 1);
      } else if (k2 === "days") b2.days = 0;
      else if (k2 === "rating") b2.rating = 0;
      else if (k2 === "offers") b2.offers = false;
      else if (k2 === "soon") b2.soon = false;
      render(); return;
    }
    if ((el = t.closest("[data-more]"))) { PAGE[el.getAttribute("data-more")] += 8; render(); return; }

    if ((el = t.closest("[data-day]")) && !el.disabled) {
      BK.day = +el.getAttribute("data-day"); BK.time = null; render(); return; }
    if ((el = t.closest("[data-time]")) && !el.disabled) {
      BK.time = el.getAttribute("data-time"); render(); return; }

    if (t.id === "add") {
      var p = P.filter(function (x) { return x.slug === route.arg; })[0], k = "p:" + p.slug;
      if (!basket.filter(function (l) { return l.key === k; }).length)
        basket.push({ key: k, kind: "p", t: p.t, p: p.p, by: p.shop, img: p.img, i: p.i, days: p.days, q: 1 });
      paint(); toast("Added to your basket"); return;
    }
    if (t.id === "book") {
      var s = S.filter(function (x) { return x.id === parseInt(route.arg, 10); })[0];
      var when = whenLabel(s), k3 = "s:" + s.id + when;
      if (!basket.filter(function (l) { return l.key === k3; }).length)
        basket.push({ key: k3, kind: "s", t: s.t, p: s.p, by: s.prov, img: s.img, i: s.i, when: when, q: 1 });
      paint(); toast("Booking added"); return;
    }
    if ((el = t.closest("[data-rm]"))) {
      basket = basket.filter(function (l) { return l.key !== el.getAttribute("data-rm"); });
      render(); toast("Removed"); return;
    }
    if ((el = t.closest("[data-co]"))) {
      CO = { kind: el.getAttribute("data-co"), step: 0, pay: null }; go("checkout"); return; }
    if ((el = t.closest("[data-pay]"))) {
      CO.pay = el.getAttribute("data-pay"); render(); return; }
    if (t.id === "conext") {
      if (CO.step < STEPS[CO.kind].length - 1) { CO.step++; render(); return; }
      basket = basket.filter(function (l) { return l.kind !== CO.kind; });
      go("done"); return;
    }
    if ((el = t.closest(".md-chip[aria-current]"))) { return; }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if ($("#fsheet").getAttribute("data-open") === "true") sheet(false);
    else menu(false);
  });

  /* search */
  var sT;
  document.addEventListener("input", function (e) {
    if (e.target.id !== "q") return;
    QUERY = e.target.value.trim().toLowerCase();
    clearTimeout(sT);
    sT = setTimeout(function () {
      if (QUERY && route.name !== "search") go("search");
      else render();
    }, 220);
  });
  document.addEventListener("submit", function (e) { e.preventDefault(); });

  render();
})();

</script>
</body>
</html>
